name: Deploy Frontend

on:
  push:
    braches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/Checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
         node-version: 22

      - name: Install Dependencies
        run: npm install
      
      - name: build
        run: npm run build

      - name: Upload Frontend
        uses: appleboy/scp-action@master
  
        with:
          host: ${{secrets.HOST}}
          username: ${{secrets.USERNAME }}
          key: ${{secrets.SSH_KEY }}
        
          source: "dist/"
          traget: "/var/www/app/frontend"